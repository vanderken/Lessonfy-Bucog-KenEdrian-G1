{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="{{ user.settings.theme|default:'light' }}" data-bg="{{ user.settings.background|default:'default' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Lessonfy{% endblock %} | Lessonfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">
      <svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 1h14v20l-7-5-7 5z" fill="var(--flag)"/></svg>Lessonfy
    </a>
    {% if user.is_authenticated %}
    <nav class="nav" aria-label="Main">
      <a href="{% url 'dashboard' %}"{% if request.resolver_match.url_name == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
      <a href="{% url 'lesson_create' %}"{% if request.resolver_match.url_name == 'lesson_create' %} aria-current="page"{% endif %}>New lesson</a>
      <a href="{% url 'lesson_upload' %}"{% if request.resolver_match.url_name == 'lesson_upload' %} aria-current="page"{% endif %}>Upload</a>
      <a href="{% url 'collections' %}"{% if request.resolver_match.url_name == 'collections' %} aria-current="page"{% endif %}>Collections</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="linklike">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
