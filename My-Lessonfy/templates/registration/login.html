{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="page narrow">
  <h1>Log in</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <p>
      <label for="{{ form.username.id_for_label }}">Email</label><br>
      {{ form.username }}{{ form.username.errors }}
    </p>
    <p>
      <label for="{{ form.password.id_for_label }}">Password</label><br>
      {{ form.password }}{{ form.password.errors }}
    </p>
    <button type="submit" class="btn pri">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
